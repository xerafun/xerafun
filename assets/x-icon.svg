<svg viewBox="0 0 100 100" width="50" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line-main { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .line-main { stroke: #ffffff; }
    }
  </style>

  <!-- Center Long Bar (/) - Draws from bottom-left to top-right -->
  <line class="line-main" x1="30.3" y1="69.7" x2="69.7" y2="30.3" stroke-width="14" stroke-linecap="square"
        stroke-dasharray="60" stroke-dashoffset="60">
    <animate id="draw_bar" attributeName="stroke-dashoffset" from="60" to="0" dur="0.5s"
             begin="0s; undraw_bar.end" fill="freeze" />
    <animate id="undraw_bar" attributeName="stroke-dashoffset" from="0" to="60" dur="0.5s"
             begin="draw_bar.end + 5s" fill="freeze" />
  </line>

  <!-- Top-Left Square Dot (⬛) - Rotated 45° parallel to diagonal -->
  <line class="line-main" x1="30.1" y1="30.1" x2="30.3" y2="30.3" stroke-width="0" stroke-linecap="square">
    <animate attributeName="stroke-width" from="0" to="14" dur="0.5s"
             begin="0s; undraw_bar.end" fill="freeze" />
    <animate attributeName="stroke-width" from="14" to="0" dur="0.5s"
             begin="draw_bar.end + 5s" fill="freeze" />
  </line>

  <!-- Bottom-Right Square Dot (⬛) - Rotated 45° parallel to diagonal -->
  <line class="line-main" x1="69.7" y1="69.7" x2="69.9" y2="69.9" stroke-width="0" stroke-linecap="square">
    <animate attributeName="stroke-width" from="0" to="14" dur="0.5s"
             begin="0s; undraw_bar.end" fill="freeze" />
    <animate attributeName="stroke-width" from="14" to="0" dur="0.5s"
             begin="draw_bar.end + 5s" fill="freeze" />
  </line>
</svg>
