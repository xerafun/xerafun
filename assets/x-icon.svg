<svg viewBox="0 0 100 100" width="50" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line-main { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .line-main { stroke: #ffffff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .line-main { stroke-dashoffset: 0; }
      animate { display: none; }
    }
  </style>

  <!-- 主笔 (/)：从左下向右上进场(↗)，停留2秒，再向右上收缩驶离 -->
  <line class="line-main" x1="25.35" y1="74.65" x2="74.65" y2="25.35" stroke-width="14" stroke-linecap="butt"
        stroke-dasharray="70 70" stroke-dashoffset="70">
    <animate attributeName="stroke-dashoffset"
             dur="3.8s"
             repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0; 0.184; 0.711; 0.895; 1"
             values="70; 0; 0; -70; -70"
             keySplines="0.16 1 0.3 1; 0 0 1 1; 0.45 0 0.55 1; 0 0 1 1" />
  </line>

  <!-- 辅笔左上块 (\)：从左下宽边向右上宽边进场(↗)，停留2秒，再向右上收缩消退 -->
  <line class="line-main" x1="27.78" y1="37.68" x2="37.68" y2="27.78" stroke-width="20.86" stroke-linecap="butt"
        stroke-dasharray="14 14" stroke-dashoffset="14">
    <animate attributeName="stroke-dashoffset"
             dur="3.8s"
             repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0; 0.184; 0.711; 0.895; 1"
             values="14; 0; 0; -14; -14"
             keySplines="0.16 1 0.3 1; 0 0 1 1; 0.45 0 0.55 1; 0 0 1 1" />
  </line>

  <!-- 辅笔右下块 (\)：从左下宽边向右上宽边进场(↗)，停留2秒，再向右上收缩消退 -->
  <line class="line-main" x1="62.33" y1="72.23" x2="72.23" y2="62.33" stroke-width="20.86" stroke-linecap="butt"
        stroke-dasharray="14 14" stroke-dashoffset="14">
    <animate attributeName="stroke-dashoffset"
             dur="3.8s"
             repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0; 0.184; 0.711; 0.895; 1"
             values="14; 0; 0; -14; -14"
             keySplines="0.16 1 0.3 1; 0 0 1 1; 0.45 0 0.55 1; 0 0 1 1" />
  </line>
</svg>
