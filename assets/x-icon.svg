<svg viewBox="0 0 100 100" width="50" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line-main { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .line-main { stroke: #ffffff; }
    }
    @media (prefers-reduced-motion: reduce) {
      .line-main { stroke-dashoffset: 0; }
      animate { display: none; }
    }
  </style>

  <!-- 主笔 (/)：从左上宽边向右下宽边进场(↘)，停留2秒，再向右下收缩消退 -->
  <line class="line-main" x1="45.05" y1="45.05" x2="54.95" y2="54.95" stroke-width="69.72" stroke-linecap="butt"
        stroke-dasharray="14 14" stroke-dashoffset="14">
    <animate attributeName="stroke-dashoffset"
             dur="3.8s"
             repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0; 0.184; 0.711; 0.895; 1"
             values="14; 0; 0; -14; -14"
             keySplines="0.05 0.9 0.1 1; 0 0 1 1; 0.4 0 0.85 0.15; 0 0 1 1" />
  </line>

  <!-- 辅笔左上段 (\)：从左上向中心进场(↘)，停留2秒，再向中心收缩消退 -->
  <line class="line-main" x1="25.35" y1="25.35" x2="40.10" y2="40.10" stroke-width="14" stroke-linecap="butt"
        stroke-dasharray="21 21" stroke-dashoffset="21">
    <animate attributeName="stroke-dashoffset"
             dur="3.8s"
             repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0; 0.184; 0.711; 0.895; 1"
             values="21; 0; 0; -21; -21"
             keySplines="0.05 0.9 0.1 1; 0 0 1 1; 0.4 0 0.85 0.15; 0 0 1 1" />
  </line>

  <!-- 辅笔右下段 (\)：从中心向右下进场(↘)，停留2秒，再向右下收缩消退 -->
  <line class="line-main" x1="59.90" y1="59.90" x2="74.65" y2="74.65" stroke-width="14" stroke-linecap="butt"
        stroke-dasharray="21 21" stroke-dashoffset="21">
    <animate attributeName="stroke-dashoffset"
             dur="3.8s"
             repeatCount="indefinite"
             calcMode="spline"
             keyTimes="0; 0.184; 0.711; 0.895; 1"
             values="21; 0; 0; -21; -21"
             keySplines="0.05 0.9 0.1 1; 0 0 1 1; 0.4 0 0.85 0.15; 0 0 1 1" />
  </line>
</svg>
