<svg viewBox="0 0 100 100" width="50" height="50" xmlns="http://www.w3.org/2000/svg">
  <style>
    .line-main { stroke: #0a0a0a; }
    @media (prefers-color-scheme: dark) {
      .line-main { stroke: #ffffff; }
    }
  </style>

  <!-- Center Diagonal Long Bar (/) - Draws from bottom-left (25.35, 74.65) to top-right (74.65, 25.35) -->
  <line class="line-main" x1="25.35" y1="74.65" x2="74.65" y2="25.35" stroke-width="14" stroke-linecap="butt"
        stroke-dasharray="70" stroke-dashoffset="70">
    <animate id="draw_bar" attributeName="stroke-dashoffset" from="70" to="0" dur="0.5s"
             begin="0s; undraw_bar.end" fill="freeze" />
    <animate id="undraw_bar" attributeName="stroke-dashoffset" from="0" to="70" dur="0.5s"
             begin="draw_bar.end + 5s" fill="freeze" />
  </line>

  <!-- Top-Left Segment (\) - Draws from Top-Left (25.35, 25.35) to Center (40.10, 40.10) -->
  <line class="line-main" x1="25.35" y1="25.35" x2="40.10" y2="40.10" stroke-width="14" stroke-linecap="butt"
        stroke-dasharray="21" stroke-dashoffset="21">
    <animate attributeName="stroke-dashoffset" from="21" to="0" dur="0.5s"
             begin="0s; undraw_bar.end" fill="freeze" />
    <animate attributeName="stroke-dashoffset" from="0" to="21" dur="0.5s"
             begin="draw_bar.end + 5s" fill="freeze" />
  </line>

  <!-- Bottom-Right Segment (\) - Draws from Bottom-Right (74.65, 74.65) to Center (59.90, 59.90) -->
  <line class="line-main" x1="74.65" y1="74.65" x2="59.90" y2="59.90" stroke-width="14" stroke-linecap="butt"
        stroke-dasharray="21" stroke-dashoffset="21">
    <animate attributeName="stroke-dashoffset" from="21" to="0" dur="0.5s"
             begin="0s; undraw_bar.end" fill="freeze" />
    <animate attributeName="stroke-dashoffset" from="0" to="21" dur="0.5s"
             begin="draw_bar.end + 5s" fill="freeze" />
  </line>
</svg>
